name: Publish Python Pal binaries
# Exact APK/APPX archive trigger

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-binaries]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact signed Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Python-Pal-1.1.0-Friend-Android
          path: release/android
          repository: justinevans4040-cloud/python-pal
          run-id: 31570471453
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact verified Microsoft Store artifact
        uses: actions/download-artifact@v4
        with:
          name: Python-Pal-Microsoft-Store-1.1.1-Corrected
          path: release/store
          repository: justinevans4040-cloud/python-pal
          run-id: 31599907523
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble repository release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/assets
          apk=$(find release/android -type f -name '*.apk' -print -quit)
          appx=$(find release/store -type f -name '*.appx' -print -quit)
          test -n "$apk"
          test -n "$appx"
          cp "$apk" release/assets/Python-Pal-1.1.0-Correct-Store-Icon.apk
          cp "$appx" release/assets/Python-Pal-Microsoft-Store-1.1.1.appx
          cp release/android/signature-verification.txt release/assets/Android-signature-verification.txt
          cp release/android/zipalign-verification.txt release/assets/Android-zipalign-verification.txt
          cp release/android/package-badging.txt release/assets/Android-package-badging.txt
          cp release/android/SHA256SUMS.txt release/assets/Android-SHA256SUMS.txt
          cp release/android/file-size.txt release/assets/Android-file-size.txt
          cp release/store/verification.txt release/assets/Store-verification.txt
          cp release/store/AppxManifest.verified.xml release/assets/AppxManifest.verified.xml
          cp RELEASES/Python-Pal-v1.1.1-README.md release/assets/Python-Pal-v1.1.1-README.md
          sha256sum release/assets/*.apk release/assets/*.appx > release/assets/SHA256SUMS.txt

      - name: Publish permanent GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Python Pal 1.1.1 — Corrected Store and Android Builds
          body: |
            Permanent binary archive for Python Pal.

            Includes the signed Android APK, the verified Microsoft Store APPX, and all build verification records.
          files: release/assets/*
          fail_on_unmatched_files: true
          make_latest: true
