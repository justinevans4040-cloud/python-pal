# ── Desktop: Build Electron Installers ───────────────────────────────────────
# Triggers: when you push a version tag like v1.0.0  (git tag v1.0.0 && git push --tags)
# Result:   GitHub Release with Windows .exe, Mac .dmg, Linux .AppImage attached.
#
# To release:
#   git tag v1.0.1
#   git push --tags

name: Build Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite web assets
        run: npm run build

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-pal-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Python Pal ${{ github.ref_name }}
          body: |
            ## Python Pal ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `Python Pal Setup *.exe` |
            | macOS    | `Python Pal *.dmg` |
            | Linux    | `Python Pal *.AppImage` |

            ### What's new
            See [CHANGELOG](https://github.com/justinevans4040-cloud/python-pal/commits/master) for details.
          files: release-artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
