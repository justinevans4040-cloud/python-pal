# ── Android: Build APK ────────────────────────────────────────────────────────
# Triggers: version tags (v*.*.*)  or manually from Actions tab.
# Result:   debug APK attached to the GitHub Release.
#
# For a signed release APK, add these secrets to your repo:
#   KEYSTORE_BASE64    — base64-encoded .jks keystore file
#   KEYSTORE_PASSWORD  — keystore password
#   KEY_ALIAS          — key alias
#   KEY_PASSWORD       — key password

name: Build Android

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build Vite web assets
        run: npm run build

      - name: Add Android platform (first time only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: find-apk
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-pal-android
          path: ${{ steps.find-apk.outputs.path }}

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.path }}
